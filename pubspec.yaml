name: registeryourcafe
description: Register Your Cafe — Flutter app with Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  file_picker: ^8.1.7
  unicons: ^3.0.0
  shared_preferences: ^2.5.3
  rxdart: ^0.28.0
  fl_chart: ^0.70.2
  http: ^1.3.0
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  firebase_analytics: ^11.6.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - assets/registeryourcafeprinter.png
