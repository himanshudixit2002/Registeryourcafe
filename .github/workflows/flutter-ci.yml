# Static analysis and unit tests on every change to main and on PRs.

name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Analyzer report (trend JSON/CSV)
        run: dart run tool/analyze_lib_report.dart

      - name: Set up Node (Firestore emulator smoke)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firestore rules unit tests
        run: npx --yes firebase-tools@14.20.0 emulators:exec --only firestore --project demo-rules-smoke "cd firestore_tests && npm ci && npm test"

      - name: Flutter test
        run: flutter test
