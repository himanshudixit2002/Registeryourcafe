<!-- Paste into Firebase Console → Authentication → Templates → Password reset → Message (HTML).
     (Verification / email-change templates do not allow editing the message body in the console.)
     Placeholders: %APP_NAME% %EMAIL% %LINK% %DISPLAY_NAME% -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background-color:#f1f5f9;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #e2e8f0;">
        <tr>
          <td style="padding:36px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:700;color:#0f172a;line-height:1.3;">
            Reset your password
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;color:#475569;line-height:1.65;">
            We received a request to reset the password for <strong>%EMAIL%</strong> on <strong>%APP_NAME%</strong>.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 32px 8px 32px;">
            <a href="%LINK%" style="display:inline-block;background-color:#0f766e;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:600;">
              Choose a new password
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 24px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:#64748b;line-height:1.5;">
            If the button does not work, copy and paste this link into your browser:<br/>
            <span style="word-break:break-all;color:#0f766e;">%LINK%</span>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:#94a3b8;line-height:1.5;border-top:1px solid #f1f5f9;padding-top:20px;">
            If you did not request a password reset, you can ignore this email. Your password will stay the same.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
